<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rhode | Peptide Skincare + Lip Essentials</title>
    <!-- Google Fonts - Cursive Handwriting -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Great+Vibes&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* BABY BLUE / LIGHT BLUE BACKGROUND */
            background: linear-gradient(135deg, #d4eef7 0%, #b8e1f0 50%, #cce8f5 100%);
            font-family: 'Inter', sans-serif;
            color: #1a2c3e;
            padding: 2rem 1.5rem;
        }

        /* main glass container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 250, 248, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 3rem 2rem 4rem 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(100, 180, 210, 0.4);
            overflow: hidden;
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s;
        }

        /* Header with cart toggle */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .cart-icon-btn {
            background: #eef3f7;
            border: 2px solid #8fcbdf;
            border-radius: 60px;
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 1rem;
            color: #2c6e8f;
        }

        .cart-icon-btn:hover {
            background: #d8eaf2;
            transform: scale(1.02);
            border-color: #4aa3c9;
        }

        .cart-count {
            background: #c95a3f;
            color: white;
            border-radius: 50px;
            padding: 0.2rem 0.7rem;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* brand header */
        .brand-header {
            text-align: center;
            margin-bottom: 1rem;
            flex: 1;
        }

        .brand-header h1 {
            font-size: 5rem;
            font-weight: 700;
            font-family: 'Great Vibes', 'Dancing Script', cursive;
            letter-spacing: 0.02em;
            background: linear-gradient(125deg, #D45F2E, #BF3F22, #EE9B54, #C1542C);
            background-size: 220% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: waveGradient 6s ease infinite;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        }

        @keyframes waveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .brand-sub {
            font-size: 1rem;
            background: #eef7fc;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 60px;
            font-weight: 500;
            color: #2c6e8f;
            border: 1px solid #b8d9e8;
        }

        /* logo photo */
        .logo-photo-section {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 1rem 0 1rem 0;
        }

        .logo-rectangle-photo {
            width: 85%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 0.8rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(100, 180, 210, 0.7);
        }

        .logo-rectangle-photo img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1.2rem;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .photo-separator {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #a8d1e6, #6bb5d9, #a8d1e6);
            border-radius: 4px;
            margin: 0.8rem auto 1.5rem auto;
        }

        /* product grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .product-card {
            background: #fffffffa;
            border-radius: 2rem;
            padding: 1.3rem;
            transition: transform 0.25s ease, box-shadow 0.3s;
            box-shadow: 0 12px 22px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid #cce3ed;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 34px -14px rgba(44, 110, 143, 0.2);
            border-color: #8fcbdf;
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: #f0f8fc;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a3b4c;
        }

        .product-desc {
            font-size: 0.7rem;
            font-weight: 600;
            color: #b55a34;
            text-transform: uppercase;
            margin: 0.2rem 0;
        }

        .product-highlight {
            font-size: 0.7rem;
            background: #fef0ea;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            width: fit-content;
        }

        .price-tag {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(125deg, #c95a3f, #e67748);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.4rem 0;
        }

        .buy-btn {
            margin-top: 0.5rem;
            background: #eef3f7;
            border: 1px solid #c0dae6;
            border-radius: 40px;
            padding: 0.6rem;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2c6e8f;
            cursor: pointer;
            transition: all 0.2s;
        }

        .buy-btn:hover {
            background: #d8eaf2;
            color: #145c7a;
        }

        /* CART MODAL / SLIDE-OUT PANEL */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .cart-overlay.open {
            visibility: visible;
            opacity: 1;
        }

        .cart-panel {
            width: 100%;
            max-width: 480px;
            background: white;
            height: 100%;
            overflow-y: auto;
            padding: 1.5rem;
            border-radius: 2rem 0 0 2rem;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0d6cc;
            margin-bottom: 1.5rem;
        }

        .cart-header h2 {
            font-size: 1.8rem;
            font-family: 'Great Vibes', cursive;
            color: #c95a3f;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #b55a34;
        }

        .cart-items {
            flex: 1;
            margin-bottom: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            background: #f0f8fc;
            border-radius: 1rem;
            object-fit: contain;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
        }

        .cart-item-price {
            color: #c95a3f;
            font-weight: 600;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }

        .cart-item-qty button {
            background: #eef3f7;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-item {
            background: none;
            border: none;
            color: #c95a3f;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem;
        }

        .cart-footer {
            border-top: 2px solid #f0d6cc;
            padding-top: 1rem;
        }

        .cart-total {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: right;
            margin-bottom: 1rem;
            color: #1a3b4c;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(125deg, #c95a3f, #e67748);
            border: none;
            padding: 1rem;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 2rem;
            color: #8c8c8c;
        }

        .spotlight {
            background: radial-gradient(ellipse at 20% 30%, #e5f2f7, #d4eaf2);
            padding: 1.2rem;
            border-radius: 2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: center;
            margin: 1rem 0;
        }

        .tag-row span {
            background: #eef3f7;
            padding: 0.25rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #2c6e8f;
        }

        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: #4f8eae;
            margin-top: 1.5rem;
        }

        @media (max-width: 720px) {
            body { padding: 1rem; }
            .container { padding: 1rem; }
            .brand-header h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <div class="brand-header">
            <h1>RHODE</h1>
            <div class="brand-sub">peptide-infused • glazed finish • luminous rituals</div>
        </div>
        <button class="cart-icon-btn" id="viewCartBtn">
            🛍️ Cart <span id="cartCountDisplay" class="cart-count">0</span>
        </button>
    </div>

    <div class="logo-photo-section">
        <div class="logo-rectangle-photo">
            <img src="rhode world at coachella 2026 _ rhode x the biebers.jpg" alt="Rhode x The Biebers" onerror="this.src='https://placehold.co/1200x675/e0f0f8/2c6e8f?text=Rhode+Coachella'">
        </div>
    </div>
    <div class="photo-separator"></div>

    <!-- PRODUCT GRID -->
    <div class="product-grid" id="productGrid">
        <!-- Products will be populated by JS for easier management -->
    </div>

    <div class="spotlight">
        <div style="font-weight: bold;">🍯 glazed donut skin ritual</div>
        <div>🏆 2K+ 5-star ratings</div>
    </div>
    <div class="tag-row" id="tagRow"></div>
    <div class="footer-note">🌊 rhode — peptide-powered, color-drenched rituals • free shipping worldwide</div>
</div>

<!-- CART MODAL -->
<div id="cartOverlay" class="cart-overlay">
    <div class="cart-panel">
        <div class="cart-header">
            <h2>Your Rhode Ritual</h2>
            <button class="close-cart" id="closeCartBtn">&times;</button>
        </div>
        <div id="cartItemsContainer" class="cart-items">
            <div class="empty-cart">Your cart is empty ✨</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total" id="cartTotal">$0.00</div>
            <button class="checkout-btn" id="checkoutBtn">Checkout →</button>
        </div>
    </div>
</div>

<script>
    // ----- PRODUCT DATABASE -----
    const products = [
        {
            id: "lip_tint",
            name: "Glazier Lip Tint",
            desc: "rhode Lipstick · Pourriture Glazier Colors",
            highlight: "✨ cherry kiss glass shine ✨",
            price: 20.00,
            image: "cherry lips.jpg",
            tagIcon: "💋🍒✨",
            category: "Lip"
        },
        {
            id: "blush_bundle",
            name: "Packet Blush Bundle",
            desc: "Hydrating Cream Blush · 10 Colors",
            highlight: "🌟 creamy dewy flush",
            price: 25.00,
            image: "Blush Rhode.jpg",
            tagIcon: "🌸🎨",
            category: "Blush"
        },
        {
            id: "glazing_milk",
            name: "Glazing Milk",
            desc: "Ceramide Facial Essence",
            highlight: "🔥 viral milky hydration",
            price: 34.00,
            image: "Rhode Glazing Milk.jpg",
            tagIcon: "🥛✨",
            category: "Skincare"
        },
        {
            id: "eye_prep",
            name: "Peptide Eye Prep",
            desc: "Depuffing Eye Patches",
            highlight: "⚡ cooling hydrogel · peptide infusion",
            price: 32.00,
            image: "peptide eye prep.jpg",
            tagIcon: "👁️💧",
            category: "Skincare"
        },
        {
            id: "lip_liner",
            name: "Rhode Lip Liner",
            desc: "Define Your Perfect Everyday Look",
            highlight: "✍️ creamy & long-wear 🫶🏻",
            price: 18.00,
            image: "Rhode Lip Liner – Define Your Perfect Everyday Look🫶🏻.jpg",
            tagIcon: "✍️💄🫶🏻",
            category: "Lip"
        }
    ];

    // Cart state: array of { id, name, price, quantity, image }
    let cart = [];

    // Load cart from localStorage if available
    function loadCart() {
        const saved = localStorage.getItem("rhode_cart");
        if (saved) {
            try {
                cart = JSON.parse(saved);
            } catch(e) { cart = []; }
        }
        updateCartUI();
    }

    function saveCart() {
        localStorage.setItem("rhode_cart", JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        // Update cart count badge on main button
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const cartCountDisplay = document.getElementById("cartCountDisplay");
        if (cartCountDisplay) cartCountDisplay.innerText = totalItems;
        
        // Render cart panel items
        const container = document.getElementById("cartItemsContainer");
        const totalSpan = document.getElementById("cartTotal");
        if (!container) return;
        
        if (cart.length === 0) {
            container.innerHTML = '<div class="empty-cart">Your cart is empty ✨</div>';
            if (totalSpan) totalSpan.innerText = "$0.00";
            return;
        }
        
        let html = '';
        let total = 0;
        cart.forEach((item, idx) => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            html += `
                <div class="cart-item" data-idx="${idx}">
                    <img class="cart-item-img" src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/70x70/e0f0f8/2c6e8f'">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        <div class="cart-item-qty">
                            <button class="qty-minus" data-id="${item.id}">−</button>
                            <span>${item.quantity}</span>
                            <button class="qty-plus" data-id="${item.id}">+</button>
                        </div>
                    </div>
                    <button class="remove-item" data-id="${item.id}">🗑️</button>
                </div>
            `;
        });
        container.innerHTML = html;
        if (totalSpan) totalSpan.innerText = `$${total.toFixed(2)}`;
        
        // Attach event listeners to dynamic buttons
        document.querySelectorAll('.qty-minus').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = btn.getAttribute('data-id');
                updateQuantity(prodId, -1);
            });
        });
        document.querySelectorAll('.qty-plus').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = btn.getAttribute('data-id');
                updateQuantity(prodId, 1);
            });
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = btn.getAttribute('data-id');
                removeItemCompletely(prodId);
            });
        });
    }
    
    function updateQuantity(productId, delta) {
        const index = cart.findIndex(item => item.id === productId);
        if (index !== -1) {
            const newQty = cart[index].quantity + delta;
            if (newQty <= 0) {
                cart.splice(index, 1);
            } else {
                cart[index].quantity = newQty;
            }
            saveCart();
        }
    }
    
    function removeItemCompletely(productId) {
        cart = cart.filter(item => item.id !== productId);
        saveCart();
    }
    
    function addToCart(product) {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: 1,
                image: product.image
            });
        }
        saveCart();
        // Show a small toast and open cart optionally
        showToast(`✨ ${product.name} added to your ritual ✨`);
        // auto-open cart for better UX (optional)
        openCart();
    }
    
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = 'linear-gradient(135deg, #c95a3f, #d97a48)';
        toast.style.color = 'white';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '1100';
        toast.style.fontFamily = 'Inter, sans-serif';
        toast.style.boxShadow = '0 8px 16px rgba(0,0,0,0.2)';
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 400);
        }, 2000);
    }
    
    function openCart() {
        const overlay = document.getElementById('cartOverlay');
        if (overlay) overlay.classList.add('open');
    }
    
    function closeCart() {
        const overlay = document.getElementById('cartOverlay');
        if (overlay) overlay.classList.remove('open');
    }
    
    // Render product grid dynamically
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        const tagRow = document.getElementById('tagRow');
        if (!grid) return;
        let productsHtml = '';
        let tagsHtml = '';
        products.forEach(prod => {
            productsHtml += `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${prod.image}" alt="${prod.name}" onerror="this.src='https://placehold.co/500x500/e0f0f8/2c6e8f?text=${prod.name.replace(/ /g, '+')}'">
                    </div>
                    <div class="card-icon">${prod.tagIcon}</div>
                    <div class="product-title">${prod.name}</div>
                    <div class="product-desc">${prod.desc}</div>
                    <div class="product-highlight">${prod.highlight}</div>
                    <div class="price-tag">$${prod.price.toFixed(2)}</div>
                    <button class="buy-btn" data-id="${prod.id}">add to bag →</button>
                </div>
            `;
            tagsHtml += `<span>${prod.tagIcon} ${prod.name}</span>`;
        });
        grid.innerHTML = productsHtml;
        if (tagRow) tagRow.innerHTML = tagsHtml;
        
        // attach add to cart events
        document.querySelectorAll('.buy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = btn.getAttribute('data-id');
                const product = products.find(p => p.id === prodId);
                if (product) addToCart(product);
            });
        });
    }
    
    // Checkout handler
    function setupCheckout() {
        const checkoutBtn = document.getElementById('checkoutBtn');
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', () => {
                if (cart.length === 0) {
                    showToast("Your cart is empty. Add some Rhode magic! 🛍️");
                    return;
                }
                showToast("💖 Thanks for shopping! This is a demo order. ✨");
                // optional: clear cart after "purchase"
                // cart = [];
                // saveCart();
                // closeCart();
            });
        }
    }
    
    // Event listeners for modal
    function bindModalEvents() {
        const viewBtn = document.getElementById('viewCartBtn');
        const closeBtn = document.getElementById('closeCartBtn');
        const overlay = document.getElementById('cartOverlay');
        if (viewBtn) viewBtn.addEventListener('click', openCart);
        if (closeBtn) closeBtn.addEventListener('click', closeCart);
        if (overlay) {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeCart();
            });
        }
    }
    
    // initialization
    function init() {
        renderProducts();
        loadCart();
        bindModalEvents();
        setupCheckout();
    }
    
    init();
</script>
</body>
</html>
