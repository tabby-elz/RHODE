        .container { max-width: 1400px; margin: 0 auto; background: rgba(255,250,248,0.92); backdrop-filter: blur(2px); border-radius: 2rem; padding: 1.5rem; }
        .brand-header { text-align: center; margin-bottom: 1rem; }
        .brand-header h1 { font-size: 3.5rem; font-family: 'Great Vibes', cursive; background: linear-gradient(125deg, #D45F2E, #BF3F22, #EE9B54, #C1542C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .cart-icon-btn { background: #eef3f7; border: 2px solid #8fcbdf; border-radius: 60px; padding: 0.4rem 1.2rem; cursor: pointer; float: right; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .product-card { background: white; border-radius: 1.2rem; padding: 0.8rem; cursor: pointer; border: 1px solid #cce3ed; }
        .product-card:hover { transform: translateY(-3px); }
        .product-image { width: 100%; height: 160px; background: #f0f8fc; border-radius: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: contain; }
        .product-title { font-size: 1rem; font-weight: 700; }
        .price-tag { font-size: 1.1rem; font-weight: 800; background: linear-gradient(125deg, #c95a3f, #e67748); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .buy-btn { margin-top: 0.4rem; background: #eef3f7; border: 1px solid #c0dae6; border-radius: 60px; padding: 0.4rem; cursor: pointer; }
        .carousel-section { margin: 1.5rem 0; background: rgba(255,248,245,0.7); border-radius: 1.5rem; padding: 1rem; }
        .carousel-track { display: flex; gap: 0.8rem; overflow-x: auto; padding: 0.5rem; }
        .carousel-slide { flex: 0 0 75%; background: white; border-radius: 1.2rem; overflow: hidden; }
        .carousel-slide img { width: 100%; height: 200px; object-fit: cover; }
        .slide-caption { padding: 0.6rem; text-align: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 2000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.open { visibility: visible; opacity: 1; }
        .modal-content { background: white; border-radius: 2rem; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal-close { float: right; font-size: 1.8rem; cursor: pointer; padding: 0.5rem; }
        .spotlight { background: #e5f2f7; padding: 0.8rem 1rem; border-radius: 1.2rem; display: flex; justify-content: space-between; margin: 1rem 0; }
        .footer-note { text-align: center; font-size: 0.7rem; margin-top: 1rem; }
    </style>

<script>
    const products = [
        { id: "lip_tint", name: "Glazier Lip Tint", desc: "Lipstick · Glazier Colors", highlight: "✨ cherry kiss glass shine ✨", price: 20.00, image: "cherry lips.jpg", tagIcon: "💋🍒", details: "23.5 ml • peptide infused" },
        { id: "blush_bundle", name: "Packet Blush Bundle", desc: "Cream Blush · 10 Colors", highlight: "🌟 creamy dewy flush", price: 25.00, image: "Blush Rhode.jpg", tagIcon: "🌸", details: "1.6g each • 10 shades" },
        { id: "glazing_milk", name: "Glazing Milk", desc: "Ceramide Facial Essence", highlight: "🔥 viral milky hydration", price: 34.00, image: "Rhode Glazing Milk.jpg", tagIcon: "🥛", details: "Milky toner • ceramides" },
        { id: "eye_prep", name: "Peptide Eye Prep", desc: "Depuffing Eye Patches", highlight: "⚡ cooling hydrogel", price: 32.00, image: "peptide eye prep.jpg", tagIcon: "👁️", details: "60 patches • peptide infusion" },
        { id: "lip_liner", name: "Rhode Lip Liner", desc: "Define Your Look", highlight: "✍️ creamy & long-wear", price: 18.00, image: "Rhode Lip Liner – Define Your Perfect Everyday Look🫶🏻.jpg", tagIcon: "✍️", details: "0.35g • smooth glide" }
    ];

    let cart = [];
    function loadCart() { const saved = localStorage.getItem("rhode_cart"); if(saved) cart = JSON.parse(saved); updateCartUI(); }
    function saveCart() { localStorage.setItem("rhode_cart", JSON.stringify(cart)); updateCartUI(); }
    function updateCartUI() { document.getElementById("cartCount").innerText = cart.reduce((s,i)=> s+i.quantity,0); }
    function addToCart(product) { let existing = cart.find(i=>i.id===product.id); if(existing) existing.quantity++; else cart.push({id:product.id,name:product.name,price:product.price,quantity:1,image:product.image}); saveCart(); alert(`✨ ${product.name} added ✨`); }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        let prods = '';
        products.forEach(p => {
            prods += `<div class="product-card" data-id="${p.id}"><div class="product-image"><img src="${p.image}" onerror="this.src='https://placehold.co/160x160'"></div><div style="font-size:1.2rem;">${p.tagIcon}</div><div class="product-title">${p.name}</div><div class="product-desc" style="font-size:0.6rem; color:#b55a34;">${p.desc}</div><div class="product-highlight" style="font-size:0.6rem; background:#fef0ea; padding:0.15rem 0.6rem; border-radius:30px; display:inline-block;">${p.highlight}</div><div class="price-tag">$${p.price}</div><button class="buy-btn" data-id="${p.id}">add to bag →</button></div>`;
        });
        grid.innerHTML = prods;
        document.querySelectorAll('.buy-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const prod = products.find(p=>p.id===btn.dataset.id); if(prod) addToCart(prod); }));
    }

    renderProducts();
    loadCart();
    document.getElementById('viewCartBtn').onclick = () => alert(`Cart has ${cart.reduce((s,i)=> s+i.quantity,0)} items`);
</script>
