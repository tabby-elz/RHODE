<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rhode | Peptide Skincare + Lip Essentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Great+Vibes&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* YOUR PHOTO AS BACKGROUND - I ONLY CHANGED THIS */
        body { 
            background-image: url('download (37).jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Inter', sans-serif; 
            color: #e0e8f5; 
            padding: 1.5rem 1rem; 
        }
        /* Semi-transparent overlay to make text readable - I DID NOT REMOVE ANYTHING ELSE */
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: rgba(10, 20, 35, 0.75); 
            backdrop-filter: blur(3px);
            border-radius: 2rem 1.5rem 3rem 1.5rem; 
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.4); 
            overflow: hidden; 
            padding: 1.5rem; 
            border: 1px solid rgba(70, 130, 200, 0.3); 
        }
        .main-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; gap: 0.8rem; }
        .cart-icon-btn { background: #1a2a4a; border: 2px solid #3a6ea5; border-radius: 60px; padding: 0.4rem 1.2rem; display: flex; align-items: center; gap: 0.6rem; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: #a8c8f0; transition: all 0.2s; }
        .cart-icon-btn:hover { background: #2a3e64; border-color: #5a8ec5; }
        .cart-count { background: #c95a3f; color: white; border-radius: 50px; padding: 0.15rem 0.6rem; font-size: 0.7rem; font-weight: bold; }
        .brand-header { text-align: center; margin-bottom: 0.5rem; flex: 1; }
        .brand-header h1 { font-size: 3.5rem; font-family: 'Great Vibes', cursive; background: linear-gradient(125deg, #D45F2E, #BF3F22, #EE9B54, #C1542C); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: waveGradient 6s ease infinite; }
        @keyframes waveGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .brand-sub { font-size: 0.8rem; background: #1a2a4a; display: inline-block; padding: 0.2rem 1rem; border-radius: 60px; color: #a8c8f0; border: 1px solid #3a6ea5; }
        .logo-photo-section { width: 100%; display: flex; justify-content: center; margin: 0.8rem 0; }
        .logo-rectangle-photo { width: 80%; max-width: 700px; background: #0a1530; border-radius: 1.2rem; padding: 0.5rem; box-shadow: 0 10px 20px -8px rgba(0,0,0,0.3); border: 2px solid rgba(70, 130, 200, 0.5); }
        .logo-rectangle-photo img { width: 100%; border-radius: 0.8rem; aspect-ratio: 16/9; object-fit: cover; }
        .photo-separator { width: 60px; height: 3px; background: linear-gradient(90deg, #3a6ea5, #6b9ed0, #3a6ea5); border-radius: 3px; margin: 0.5rem auto 1rem auto; }
        .carousel-section { margin: 1.5rem 0; background: rgba(10, 20, 40, 0.6); border-radius: 1.5rem; padding: 1rem; }
        .carousel-title { text-align: center; font-family: 'Great Vibes', cursive; font-size: 1.6rem; color: #e8a07c; margin-bottom: 0.8rem; }
        .carousel-track-wrapper { overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; border-radius: 1rem; }
        .carousel-track { display: flex; gap: 0.8rem; padding: 0.5rem; }
        .carousel-slide { flex: 0 0 75%; scroll-snap-align: start; background: #0a1530; border-radius: 1.2rem; overflow: hidden; box-shadow: 0 8px 15px -8px rgba(0,0,0,0.3); border: 1px solid #3a6ea5; }
        .carousel-slide img { width: 100%; height: 200px; object-fit: cover; }
        .slide-caption { padding: 0.6rem; text-align: center; }
        .slide-caption h4 { font-size: 0.9rem; font-weight: 700; color: #e8a07c; }
        .carousel-nav { display: flex; justify-content: center; gap: 0.8rem; margin-top: 0.8rem; }
        .carousel-nav button { background: #1a2a4a; border: 1px solid #3a6ea5; border-radius: 60px; padding: 0.3rem 1rem; cursor: pointer; font-size: 0.75rem; color: #a8c8f0; transition: all 0.2s; }
        .carousel-nav button:hover { background: #2a3e64; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin: 1.5rem 0; }
        .product-card { background: #0a1530; border-radius: 1.2rem; padding: 0.8rem; transition: transform 0.2s; box-shadow: 0 6px 12px -8px rgba(0,0,0,0.3); border: 1px solid #2a4a7a; cursor: pointer; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 12px 18px -10px rgba(0,0,0,0.4); border-color: #5a8ec5; }
        .product-image { width: 100%; height: 180px; background: #0d1a35; border-radius: 1rem; margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: contain; }
        .product-title { font-size: 1rem; font-weight: 700; color: #e0e8f5; }
        .product-desc { font-size: 0.6rem; font-weight: 600; color: #e8a07c; text-transform: uppercase; margin: 0.2rem 0; }
        .product-highlight { font-size: 0.6rem; background: #2a3e5a; padding: 0.15rem 0.6rem; border-radius: 30px; display: inline-block; color: #e0e8f5; }
        .price-tag { font-size: 1.1rem; font-weight: 800; background: linear-gradient(125deg, #c95a3f, #e67748); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0.3rem 0; }
        .buy-btn { margin-top: 0.4rem; background: #1a2a4a; border: 1px solid #3a6ea5; border-radius: 60px; padding: 0.4rem; font-weight: 600; font-size: 0.7rem; color: #a8c8f0; cursor: pointer; transition: all 0.2s; }
        .buy-btn:hover { background: #2a3e64; border-color: #5a8ec5; }
        .spotlight { background: rgba(10, 20, 40, 0.8); padding: 0.8rem 1rem; border-radius: 1.2rem; display: flex; justify-content: space-between; margin: 1rem 0; font-size: 0.75rem; border: 1px solid #3a6ea5; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 0.8rem 0; }
        .tag-row span { background: #1a2a4a; padding: 0.2rem 0.8rem; border-radius: 50px; font-size: 0.65rem; color: #a8c8f0; border: 1px solid #3a6ea5; }
        .footer-note { text-align: center; font-size: 0.7rem; color: #8aaec0; margin-top: 1rem; }
        @media (min-width:600px){ .carousel-slide { flex: 0 0 40%; } }
        @media (min-width:900px){ .carousel-slide { flex: 0 0 25%; } }
        @media (max-width:550px){ .product-grid { grid-template-columns: 1fr 1fr; } .product-image { height: 140px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="main-header">
        <div class="brand-header"><h1>RHODE</h1><div class="brand-sub">peptide-infused • glazed finish</div></div>
        <button class="cart-icon-btn" id="viewCartBtn">🛍️ <span id="cartCountDisplay">0</span></button>
    </div>
    <div class="logo-photo-section"><div class="logo-rectangle-photo"><img src="rhode world at coachella 2026 _ rhode x the biebers.jpg" alt="Rhode" onerror="this.src='https://placehold.co/800x450'"></div></div>
    <div class="photo-separator"></div>
    <div class="carousel-section">
        <div class="carousel-title">✨ accessories ✨</div>
        <div class="carousel-track-wrapper" id="carouselWrapper"><div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><img src="rhode lip case.jpg" alt="Lip Case"><div class="slide-caption"><h4>Rhode Lip Case</h4></div></div>
            <div class="carousel-slide"><img src="Current obsession 🐻🤎.jpg" alt="Current Obsession"><div class="slide-caption"><h4>🐻 current obsession 🐻🤎</h4></div></div>
        </div></div>
        <div class="carousel-nav"><button id="prevSlideBtn">◀</button><button id="nextSlideBtn">▶</button></div>
    </div>
    <div class="product-grid" id="productGrid"></div>
    <div class="spotlight"><span>🍯 glazed donut skin</span><span>🏆 2K+ ratings</span></div>
    <div class="tag-row" id="tagRow"></div>
    <div class="footer-note">✨ Click any product to see full details ✨</div>
</div>
<script>
    const products = [
        { id: "lip_tint", name: "Glazier Lip Tint", desc: "Lipstick · Glazier Colors", highlight: "✨ cherry kiss glass shine", price: 20.00, image: "cherry lips.jpg", tagIcon: "💋🍒", fullDesc: "A peptide-infused lip tint that delivers a glass-like shine with a sheer wash of cherry color." },
        { id: "blush_bundle", name: "Packet Blush Bundle", desc: "Cream Blush · 10 Colors", highlight: "🌟 creamy dewy flush", price: 25.00, image: "Blush Rhode.jpg", tagIcon: "🌸", fullDesc: "A hydrating cream blush bundle featuring 10 versatile shades." },
        { id: "glazing_milk", name: "Glazing Milk", desc: "Ceramide Facial Essence", highlight: "🔥 viral milky hydration", price: 34.00, image: "Rhode Glazing Milk.jpg", tagIcon: "🥛", fullDesc: "A viral ceramide facial essence that gives you that coveted 'glazed donut' skin." },
        { id: "eye_prep", name: "Peptide Eye Prep", desc: "Depuffing Eye Patches", highlight: "⚡ cooling hydrogel", price: 32.00, image: "peptide eye prep.jpg", tagIcon: "👁️", fullDesc: "Cooling hydrogel eye patches infused with peptides to instantly depuff and refresh." },
        { id: "lip_liner", name: "Rhode Lip Liner", desc: "Define Your Look", highlight: "✍️ creamy & long-wear", price: 18.00, image: "Rhode Lip Liner – Define Your Perfect Everyday Look🫶🏻.jpg", tagIcon: "✍️", fullDesc: "Define your perfect everyday look with this creamy, long-wear lip liner." }
    ];
    let cart = [];
    function loadCart() { const saved = localStorage.getItem("rhode_cart"); if(saved) try{ cart = JSON.parse(saved); }catch(e){} updateCartUI(); }
    function saveCart() { localStorage.setItem("rhode_cart", JSON.stringify(cart)); updateCartUI(); }
    function updateCartUI() { document.getElementById("cartCountDisplay").innerText = cart.reduce((s,i)=> s+i.quantity,0); }
    function addToCart(product) { let existing = cart.find(i=>i.id===product.id); if(existing) existing.quantity++; else cart.push({id:product.id,name:product.name,price:product.price,quantity:1,image:product.image}); saveCart(); alert(`✨ ${product.name} added ✨`); }
    function renderProducts() {
        const grid = document.getElementById('productGrid'), tagRow = document.getElementById('tagRow');
        let prods = '', tags = '';
        products.forEach(p => {
            prods += `<div class="product-card" data-id="${p.id}"><div class="product-image"><img src="${p.image}" onerror="this.src='https://placehold.co/180x180'"></div><div style="font-size:1.2rem;">${p.tagIcon}</div><div class="product-title">${p.name}</div><div class="product-desc">${p.desc}</div><div class="product-highlight">${p.highlight}</div><div class="price-tag">$${p.price}</div><button class="buy-btn" data-id="${p.id}">add to bag →</button></div>`;
            tags += `<span>${p.tagIcon} ${p.name}</span>`;
        });
        grid.innerHTML = prods; tagRow.innerHTML = tags;
        document.querySelectorAll('.buy-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const prod = products.find(p=>p.id===btn.dataset.id); if(prod) addToCart(prod); }));
        document.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', (e) => { if(e.target.classList.contains('buy-btn')) return; const prod = products.find(p=>p.id===card.dataset.id); if(prod) alert(`📦 ${prod.name}\n💰 $${prod.price}\n✨ ${prod.highlight}\n\n${prod.fullDesc}`); }));
    }
    function setupCarousel() { const w = document.getElementById('carouselWrapper'); const p = document.getElementById('prevSlideBtn'); const n = document.getElementById('nextSlideBtn'); if(w&&p&&n) { p.onclick=()=>w.scrollBy({left:-250,behavior:'smooth'}); n.onclick=()=>w.scrollBy({left:250,behavior:'smooth'}); } }
    renderProducts(); loadCart(); setupCarousel(); document.getElementById('viewCartBtn').onclick = () => alert(`Cart: ${cart.reduce((s,i)=> s+i.quantity,0)} items\nTotal: $${cart.reduce((s,i)=> s+(i.price*i.quantity),0).toFixed(2)}`);
</script>
</body>
</html>
